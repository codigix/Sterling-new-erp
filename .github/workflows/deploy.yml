name: Sterling ERP CI/CD

on:
  push:
    branches:
      - production-branch

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull Latest Code
        run: |
          set -e
          cd /var/www/Sterling-new-erp
          git pull origin production-branch

      - name: Install Frontend Dependencies
        run: |
          cd /var/www/Sterling-new-erp/frontend
          npm ci

      - name: Install Backend Dependencies
        run: |
          cd /var/www/Sterling-new-erp/backend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd /var/www/Sterling-new-erp/backend
          npx prisma generate

      - name: Apply Database Migrations
        run: |
          cd /var/www/Sterling-new-erp/backend
          npx prisma migrate deploy

      - name: Restart Backend
        run: |
          pm2 restart sterling-backend

      - name: Verify PM2 Status
        run: |
          pm2 status
          pm2 list

      - name: Deployment Successful
        run: |
          echo "✅ Sterling ERP deployed successfully."