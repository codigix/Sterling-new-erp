name: Sterling ERP Dev CI/CD

on:
  push:
    branches: [ development-branch ] # 1. Trigger only on development-branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/Sterling-new-erp
            
            # 2. Pull from the development-branch
            git pull origin development-branch
            
            cd frontend
            npm install
            npm run build
            
            cd ../backend
            npm install
            
            pm2 restart sterling
            echo "Dev Deployment Successful!"
