name: Sterling ERP Development Deploy

on:
  push:
    branches: [ "development-branch" ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      # 1. Manually pull the code into your specific directory
      - name: Pull latest code
        run: |
          cd /var/www/Sterling-new-erp
          git pull origin development-branch

      # 2. Update Frontend
      - name: Update Frontend
        run: |
          cd /var/www/Sterling-new-erp/frontend
          npm install
          npm run build

      # 3. Update Backend & Prisma
      - name: Update Backend & Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd /var/www/Sterling-new-erp/backend
          npm install
          npx prisma generate
          npx prisma migrate deploy

      # 4. Restart
      - name: Restart Application
        run: |
          pm2 restart all
